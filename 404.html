<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Briefeed</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090b;
      --text-primary: #F5F5F7;
      --text-secondary: #86868B;
      --text-tertiary: #6B6B70;
      --border: rgba(255,255,255,0.08);
      --accent: #FFDB03;
      --accent-2: #EB001B;
      --font-display: 'Fraunces', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    .label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 32px;
    }
    .code {
      font-family: var(--font-display);
      font-variation-settings: "opsz" 144;
      font-size: 180px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    .title {
      font-family: var(--font-display);
      font-variation-settings: "opsz" 60;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 20px;
      max-width: 520px;
    }
    .desc {
      font-size: 16px;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.55;
      letter-spacing: -0.005em;
      margin-bottom: 48px;
    }
    .home-btn {
      padding: 14px 28px;
      background: var(--accent);
      color: #111;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.3s var(--ease-spring), filter 0.3s ease;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }
    .home-btn .arrow {
      transition: transform 0.3s var(--ease-spring);
    }
    .home-btn:hover .arrow {
      transform: translateX(4px);
    }
    .meta {
      position: fixed;
      bottom: 32px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-tertiary);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="label">Erreur · Page introuvable</div>
  <div class="code">404</div>
  <h1 class="title">Cette page n'existe pas, ou n'existe plus.</h1>
  <p class="desc">Le lien est peut-être obsolète, ou l'article a été déplacé. Retournez au sommaire pour reprendre votre lecture.</p>
  <a href="./" class="home-btn">
    Retour à Briefeed
    <span class="arrow">→</span>
  </a>
  <div class="meta">Briefeed · Édition Tablette</div>
</body>
</html>
