<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Briefeed — Édition Tablette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
@import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");

/* ══ TOKENS ÉDITORIAUX — repris de Briefeed iPhone ═══════════ */
:root {
  --bg: #07090b;
  --surface: #111111;
  --surface-2: #1c1c1e;
  --surface-3: #2c2c2e;
  --border: rgba(255,255,255,0.08);
  --border-mid: rgba(255,255,255,0.14);
  --border-strong: rgba(255,255,255,0.22);
  --text-primary: #F5F5F7;
  --text-secondary: #86868B;
  --text-tertiary: #6B6B70;
  --text-quaternary: #48484D;
  --header-bg: rgba(7,9,11,0.93);
  --sidebar-bg: #0a0c0e;
  --modal-bg: #0f1113;
  --accent: #FFDB03;
  --accent-fg: #111111;
  --accent-subtle: rgba(255,219,3,0.10);
  --accent-ring: rgba(255,219,3,0.28);
  --accent-2: #EB001B;
  --accent-2-fg: #ffffff;
  --accent-2-subtle: rgba(235,0,27,0.10);
  --accent-2-ring: rgba(235,0,27,0.28);
  --danger: #ed1149;
  --font-display: 'Fraunces', Georgia, serif;
  --font-reader: 'Merriweather', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --r-xs: 6px; --r-sm: 8px; --r-md: 10px; --r-lg: 12px;
  --r-xl: 14px; --r-2xl: 18px; --r-full: 999px;
  --r-card: 14px;
  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  -webkit-font-smoothing: antialiased;
  box-sizing: border-box;
}
html, body {
  margin: 0;
  height: 100%;
}
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-primary);
}
button:focus-visible {
  outline: 2px solid var(--accent) !important;
}
a { text-decoration: none; }

/* ══ APP CONTAINER ═══════════════════════════════════════════ */
.app {
  background-color: var(--bg);
  width: 100%;
  min-width: 1100px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: filter 0.6s var(--ease-spring);
}
.app.blurred {
  filter: blur(15px);
}

/* ══ HEADER LOGO ─ FRAUNCES ÉDITORIAL ════════════════════════ */
.app .div-column {
  width: 100%;
  max-width: 816px;
  padding-top: 72px;
  gap: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.app .apple-logo-pin-svg {
  width: 96px;
  height: 0px;
}
.app .paragraph {
  width: 100%;
  max-width: 816px;
  height: 120px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.app .text-wrapper {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 144;
  font-weight: 500;
  color: var(--text-primary);
  font-size: 56px;
  text-align: center;
  letter-spacing: -0.025em;
  line-height: 1;
  white-space: nowrap;
}

/* ══ SECTIONS ════════════════════════════════════════════════ */
.app .section-section {
  width: 100%;
  max-width: 985px;
  margin: 32px auto 0;
  display: flex;
  flex-direction: column;
  gap: 80px;
}
.app .div-large {
  margin-top: 24px;
  gap: 28px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.app .morning-briefing {
  display: flex;
  width: 100%;
  position: relative;
  margin-top: 8px;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 24px;
}
.app .container {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 985px;
  align-items: center;
  gap: 12px;
  position: relative;
}
.app .votre-briefing-wrapper {
  position: relative;
  width: 100%;
  height: 19px;
  opacity: 0.85;
  display: flex;
  justify-content: center;
  align-items: center;
}
.app .votre-briefing {
  position: relative;
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--text-secondary);
  font-size: 11px;
  letter-spacing: 0.22em;
  line-height: 1.5;
  white-space: nowrap;
  text-transform: uppercase;
}

/* ══ DIVIDER "Il y a 15 ans" ─ FRAUNCES ITALIC ══════════════ */
.app .div-divider-top {
  height: auto;
  padding-top: 28px;
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--border);
  width: 100%;
}
.app .p {
  margin-top: 0;
  display: flex;
  width: 100%;
  position: relative;
  flex-direction: column;
  align-items: center;
}
.app .div-wrapper {
  position: relative;
  width: auto;
}
.app .text-wrapper-2 {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 30;
  font-style: italic;
  font-weight: 400;
  color: var(--text-secondary);
  font-size: 19px;
  text-align: center;
  letter-spacing: -0.01em;
  line-height: 1.4;
}

/* ══ "Bonsoir" GREETING ─ FRAUNCES MASSIF ═══════════════════ */
.app .stay-informed {
  width: 100%;
  max-width: 985px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 56px;
}
.app .stay-informed-2 {
  display: flex;
  width: 100%;
  height: auto;
  position: relative;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.app .paragraph-2 {
  position: relative;
  width: auto;
}
.app .text-wrapper-3 {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 144;
  font-weight: 400;
  color: var(--text-primary);
  font-size: 56px;
  text-align: center;
  letter-spacing: -0.025em;
  line-height: 1;
  white-space: nowrap;
}
.app .container-5 {
  position: relative;
  width: auto;
  height: 25px;
}
.app .text-wrapper-4 {
  position: relative;
  font-family: var(--font-mono);
  font-weight: 400;
  color: var(--text-tertiary);
  font-size: 12px;
  letter-spacing: 0.05em;
  line-height: 1.6;
  text-transform: uppercase;
}

/* ══ FEATURED CARD ─ AVEC GRAYSCALE-TO-COLOR ════════════════ */
.app .stay-informed-card {
  width: 100%;
  max-width: 985px;
  height: 426px;
  display: flex;
  gap: 56px;
  background-color: var(--bg);
  border-radius: 24px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: border-color .3s var(--ease-spring), transform .4s var(--ease-spring);
}
.app .stay-informed-card:hover {
  border-color: var(--border-mid);
  transform: translateY(-2px);
}
.app .stay-informed-card-2 {
  width: 390px;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 56px 0;
}
.app .paragraph-3 {
  margin-left: 56px;
  width: 290px;
  display: flex;
}
.app .text-wrapper-5 {
  width: auto;
  height: 21px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.18em;
  line-height: 21px;
  color: var(--accent-2);
  text-transform: uppercase;
  white-space: nowrap;
}
.app .paragraph-4 {
  margin-left: 56px;
  width: 290px;
  display: flex;
}
.app .text-wrapper-6 {
  width: auto;
  max-width: 290px;
  font-family: var(--font-display);
  font-variation-settings: "opsz" 30;
  font-weight: 600;
  color: var(--text-primary);
  font-size: 26px;
  letter-spacing: -0.022em;
  line-height: 32px;
}
.app .the-NBA-has {
  margin-top: 4px;
  width: 290px;
  font-family: var(--font-sans);
  font-weight: 400;
  color: var(--text-secondary);
  font-size: 15px;
  letter-spacing: -0.01em;
  line-height: 23px;
}
.app .paragraph-5 {
  display: flex;
  margin-left: 56px;
  width: 290px;
  height: 18px;
  position: relative;
  align-items: flex-start;
  margin-top: auto;
}
.app .text-wrapper-7 {
  position: relative;
  flex: 1;
  margin-top: -1px;
  color: var(--text-tertiary);
  font-size: 11px;
  letter-spacing: 0.08em;
  line-height: 18px;
  font-family: var(--font-mono);
  font-weight: 400;
  text-transform: uppercase;
}
.app .stay-informed-link {
  margin-left: 56px;
  width: 200px;
  height: 20px;
  position: relative;
  margin-top: 8px;
}
.app .paragraph-6 {
  position: absolute;
  top: -2px;
  left: 0;
  width: 200px;
  height: 25px;
  display: flex;
}
.app .text-wrapper-8 {
  margin-top: -1px;
  width: auto;
  height: 25px;
  font-family: var(--font-sans);
  font-weight: 500;
  color: var(--accent);
  font-size: 15px;
  letter-spacing: -0.01em;
  line-height: 25px;
  white-space: nowrap;
}
.app .text-wrapper-8::after {
  content: ' →';
  display: inline-block;
  transition: transform .3s var(--ease-spring);
}
.app .stay-informed-card:hover .text-wrapper-8::after {
  transform: translateX(4px);
}

.app .stay-informed-card-3 {
  width: 540px;
  height: 100%;
  background-size: cover;
  background-position: 50% 50%;
  background-color: var(--surface-2);
  position: relative;
  filter: grayscale(100%) contrast(0.82) brightness(0.85);
  transition: filter .9s var(--ease-spring);
}
.app .stay-informed-card:hover .stay-informed-card-3 {
  filter: grayscale(0%) contrast(1) brightness(1);
}
.app .stay-informed-card-3::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface-3) 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
}
.app .stay-informed-card-3.no-image::before { opacity: 1; }
.app .stay-informed-card-3.no-image { filter: none; }

/* ══ APPLE TV+ MARQUEE (BRIEFING) ─ GRAYSCALE EDITION ══════ */
.apple-marquee-container {
  width: 100%;
  max-width: 985px;
  height: 268px;
  position: relative;
  overflow: hidden;
  background: var(--bg);
  border-radius: 18px;
}

.marquee-controls {
  position: absolute;
  width: 26px;
  height: 33px;
  right: 14px;
  top: 7px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pause-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border-mid);
  border-radius: 50%;
  background: rgba(7,9,11,0.6);
  backdrop-filter: blur(10px);
  cursor: pointer;
  position: relative;
  transition: all 0.2s var(--ease-spring);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 0;
}

.pause-btn:hover {
  border-color: var(--border-strong);
  background: rgba(7,9,11,0.85);
  transform: scale(1.08);
}

.pause-bar {
  width: 2px;
  height: 10px;
  background: var(--text-primary);
  border-radius: 1px;
}

.pause-btn.playing .pause-bar:nth-child(1) {
  width: 0;
  height: 0;
  border-left: 6px solid var(--text-primary);
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  background: transparent;
  margin-left: 2px;
}
.pause-btn.playing .pause-bar:nth-child(2) { display: none; }

.marquee-row {
  position: absolute;
  height: 109px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  will-change: transform;
}
.marquee-row.row-1 { top: 50px; left: 0; animation: marquee-slide-1 60s linear infinite; }
.marquee-row.row-2 { top: 159px; left: 0; animation: marquee-slide-2 55s linear infinite; }
.marquee-row.paused { animation-play-state: paused; }

@keyframes marquee-slide-1 {
  0% { transform: translateX(0); }
  100% { transform: translateX(calc(-100% - 10px)); }
}
@keyframes marquee-slide-2 {
  0% { transform: translateX(0); }
  100% { transform: translateX(calc(-100% - 10px)); }
}

.marquee-track {
  display: flex;
  gap: 10px;
  padding: 0;
}

.marquee-card {
  width: 171px;
  height: 97px;
  border-radius: var(--r-card);
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
  cursor: pointer;
  background: var(--surface);
}

.marquee-card-img {
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-color: var(--surface);
  filter: grayscale(100%) contrast(0.85) brightness(0.88);
  transition: filter .7s var(--ease-spring), transform 0.6s var(--ease-spring);
}
.marquee-card:hover .marquee-card-img {
  filter: grayscale(0%) contrast(1) brightness(1);
  transform: scale(1.06);
}
.marquee-card-img:empty,
.marquee-card-img[style*="url('')"] {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
  filter: none;
}

.marquee-hover-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.7) 100%);
  opacity: 0;
  transition: opacity 0.4s var(--ease-spring);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 14px;
}
.marquee-card:hover .marquee-hover-overlay { opacity: 1; }

.marquee-cta {
  padding: 7px 14px;
  background: var(--accent);
  border-radius: var(--r-full);
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 12px;
  color: var(--accent-fg);
  letter-spacing: -0.01em;
  transform: translateY(8px);
  transition: transform 0.3s var(--ease-spring);
}
.marquee-card:hover .marquee-cta { transform: translateY(0); }

.marquee-cta-arrow {
  width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.marquee-cta-arrow::before {
  content: '→';
  font-size: 14px;
  font-weight: 700;
}

.marquee-card-source {
  position: absolute;
  bottom: 7px;
  left: 7px;
  padding: 3px 8px;
  background: rgba(7,9,11,0.78);
  backdrop-filter: blur(10px);
  border-radius: 5px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-family: var(--font-mono);
  z-index: 1;
  color: var(--text-primary);
}

/* ══ VIEW TOGGLE BAR ════════════════════════════════════════ */
.view-toggle-bar {
  width: 100%;
  max-width: 985px;
  margin: 64px auto 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
}
.view-toggle-bar h3 {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 30;
  font-weight: 600;
  font-size: 28px;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}
.view-toggle-pills {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 4px;
}
.view-pill {
  padding: 7px 18px;
  border-radius: var(--r-sm);
  border: none;
  background: transparent;
  color: var(--text-tertiary);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s var(--ease-spring);
  letter-spacing: -0.01em;
}
.view-pill.active {
  background: var(--text-primary);
  color: var(--bg);
}
.view-pill:hover:not(.active) { color: var(--text-primary); }

/* ══ NEWS GRID ─ PLUS D'ESPACE ═══════════════════════════════ */
.news-grid {
  display: grid;
  width: 100%;
  max-width: 985px;
  margin: 36px auto 0;
  grid-template-columns: repeat(3, 1fr);
  gap: 56px 28px;
  padding: 0 0 140px;
}
.news-grid.view-hidden { display: none; }

.news-card {
  position: relative;
  width: 100%;
  height: auto;
  min-height: 280px;
  cursor: pointer;
  transition: transform 0.35s var(--ease-spring);
}
.news-card:hover { transform: translateY(-4px); }

.card-img-wrap {
  width: 100%;
  height: 180px;
  border-radius: var(--r-card);
  overflow: hidden;
  border: 1px solid var(--border);
  position: relative;
  background: var(--surface);
}
.card-img-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--surface), var(--surface-2));
  opacity: 0;
  transition: opacity 0.3s ease;
}
.card-img-wrap.no-image::before { opacity: 1; }

.card-img {
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  filter: grayscale(100%) contrast(0.85) brightness(0.88);
  transition: filter .8s var(--ease-spring), transform .6s var(--ease-spring);
}
.news-card:hover .card-img {
  filter: grayscale(0%) contrast(1) brightness(1);
  transform: scale(1.04);
}
.card-img-wrap.no-image .card-img { filter: none; }

.card-body {
  padding: 18px 2px 0;
}
.card-body-title {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 30;
  font-weight: 600;
  color: var(--text-primary);
  font-size: 18px;
  letter-spacing: -0.018em;
  line-height: 25px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 12px;
}
.card-body-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.card-source { font-weight: 600; }
.card-sep { color: var(--text-quaternary); }
.card-date { color: var(--text-tertiary); }

.loading-indicator {
  text-align: center;
  padding: 48px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  grid-column: 1 / -1;
}

/* ══ NEWS MASONRY ─ PLUS D'ESPACE ═══════════════════════════ */
.news-masonry {
  width: 100%;
  max-width: 985px;
  margin: 36px auto 0;
  padding: 0 0 140px;
  column-count: 3;
  column-gap: 28px;
}
.news-masonry.view-hidden { display: none; }

.masonry-card {
  position: relative;
  width: 100%;
  margin-bottom: 36px;
  break-inside: avoid;
  cursor: pointer;
  transition: transform 0.35s var(--ease-spring);
  display: inline-block;
}
.masonry-card:hover { transform: translateY(-4px); }

.masonry-img-wrap {
  width: 100%;
  border-radius: var(--r-card);
  overflow: hidden;
  border: 1px solid var(--border);
  position: relative;
  background: var(--surface);
}
.masonry-img-wrap::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--surface), var(--surface-2));
  opacity: 0;
  transition: opacity 0.3s ease;
}
.masonry-img-wrap.no-image::before { opacity: 1; }
.masonry-img-wrap.no-image { padding-bottom: 66.67%; }

.masonry-img {
  width: 100%;
  height: auto;
  display: block;
  filter: grayscale(100%) contrast(0.85) brightness(0.88);
  transition: filter .8s var(--ease-spring), transform .6s var(--ease-spring);
}
.masonry-card:hover .masonry-img {
  filter: grayscale(0%) contrast(1) brightness(1);
  transform: scale(1.04);
}

.masonry-body {
  padding: 20px 8px 4px;
}
.masonry-body-title {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 30;
  font-weight: 600;
  color: var(--text-primary);
  font-size: 17px;
  letter-spacing: -0.018em;
  line-height: 24px;
  margin-bottom: 12px;
}
.masonry-body-desc {
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 21px;
  color: var(--text-secondary);
  margin-bottom: 14px;
  letter-spacing: -0.005em;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.masonry-body-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.masonry-source { font-weight: 600; }

/* ══ NEWS LIST ─ STYLE ÉDITORIAL ═══════════════════════════ */
.news-list-container {
  width: 100%;
  max-width: 985px;
  margin: 24px auto 0;
  padding: 0 0 140px;
  display: flex;
  flex-direction: column;
}
.news-list-container.view-hidden { display: none; }

.list-section-label {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.22em;
  padding: 28px 8px 20px;
}

.list-item {
  display: flex;
  align-items: flex-start;
  gap: 32px;
  padding: 32px 8px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: opacity 0.2s, padding-left 0.3s var(--ease-spring);
  position: relative;
}
.list-item:last-child { border-bottom: none; }
.list-item:hover {
  opacity: 1;
  padding-left: 16px;
}

.list-item-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.list-item-title {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 30;
  font-weight: 600;
  font-size: 21px;
  line-height: 29px;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.list-item-desc {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 22px;
  color: var(--text-secondary);
  letter-spacing: -0.005em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.list-item-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 4px;
}
.list-item-source { font-weight: 600; }
.list-item-time { color: var(--text-tertiary); }

.list-item-img {
  width: 180px;
  min-width: 180px;
  height: 124px;
  border-radius: var(--r-card);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
}
.list-item-img::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--surface), var(--surface-2));
  opacity: 0;
  transition: opacity 0.3s ease;
}
.list-item-img.no-image::before { opacity: 1; }
.list-item-img img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  filter: grayscale(100%) contrast(0.85) brightness(0.88);
  transition: filter .8s var(--ease-spring), transform .6s var(--ease-spring);
}
.list-item:hover .list-item-img img {
  filter: grayscale(0%) contrast(1) brightness(1);
  transform: scale(1.06);
}
.list-item-img img.failed { display: none; }

/* ══ TIMELINE NAVIGATOR ════════════════════════════════════ */
.timeline-nav {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 500;
}
.timeline-nav.visible { display: flex; }
.timeline-pill {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(15,17,19,0.94);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--border-mid);
  border-radius: var(--r-full);
  padding: 10px 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  user-select: none;
}
.tl-date {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  letter-spacing: 0.08em;
  font-family: var(--font-mono);
  text-transform: uppercase;
  min-width: 110px;
  text-align: center;
}
.tl-count {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-subtle);
  border: 1px solid var(--accent-ring);
  border-radius: var(--r-full);
  padding: 3px 9px;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}
.tl-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text-primary);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s var(--ease-spring);
  flex-shrink: 0;
}
.tl-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: var(--border-mid);
}
.tl-btn:active { transform: scale(0.9); }
.tl-btn:disabled { opacity: 0.2; cursor: default; pointer-events: none; }
.tl-btn svg {
  width: 13px; height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ══ SIDEBAR ÉDITORIAL ═════════════════════════════════════ */
.sidebar-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.78);
  backdrop-filter: blur(10px) saturate(160%);
  z-index: 1999;
  opacity: 0;
  visibility: hidden;
  transition: all 0.45s var(--ease-spring);
}
.sidebar-overlay.active {
  opacity: 1;
  visibility: visible;
}

.sidebar-container {
  position: fixed;
  width: 340px;
  height: 100vh;
  left: -340px;
  top: 0;
  background: var(--sidebar-bg);
  z-index: 2000;
  transition: left 0.55s var(--ease-spring);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.sidebar-container.open { left: 0; }

.sidebar-header {
  position: sticky;
  top: 0;
  height: 72px;
  background: var(--sidebar-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  z-index: 10;
}
.sidebar-title {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 30;
  font-weight: 500;
  font-size: 26px;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}
.sidebar-close {
  width: 36px; height: 36px;
  border-radius: var(--r-md);
  cursor: pointer;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.sidebar-close:hover { background: rgba(255,255,255,0.06); }
.sidebar-close::before,
.sidebar-close::after {
  content: '';
  position: absolute;
  width: 16px; height: 1.5px;
  background: var(--text-primary);
  border-radius: 1px;
}
.sidebar-close::before { transform: rotate(45deg); }
.sidebar-close::after  { transform: rotate(-45deg); }

.scroll-view {
  flex: 1;
  overflow-y: auto;
  padding: 0 12px 40px 12px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.scroll-view::-webkit-scrollbar { display: none; }

.group-label {
  padding: 24px 22px 12px;
  font-size: 10px;
  color: var(--text-quaternary);
  text-transform: uppercase;
  letter-spacing: 0.22em;
  font-weight: 600;
  font-family: var(--font-mono);
}

.accordion-item {
  background: transparent;
  border-radius: var(--r-lg);
  margin-bottom: 4px;
  overflow: hidden;
  transition: all 0.4s var(--ease-in-out);
}
.accordion-item.active { margin-bottom: 8px; }

.accordion-header {
  display: flex;
  align-items: center;
  padding: 14px 22px;
  cursor: default;
  user-select: none;
  position: relative;
  transition: padding 0.3s ease;
  color: var(--text-tertiary);
  font-size: 14px;
  font-family: var(--font-sans);
}
.accordion-item.active .accordion-header {
  padding-bottom: 12px;
  color: var(--text-primary);
}
.accordion-item.no-submenu .accordion-header { color: var(--text-tertiary); }
.accordion-item.no-submenu .accordion-header:hover { color: var(--text-primary); }
.accordion-item.no-submenu.active .accordion-header { color: var(--accent); }

.accordion-title {
  flex: 1;
  font-weight: 500;
  letter-spacing: -0.01em;
  transition: color 0.2s;
}
.accordion-title:hover { color: var(--accent) !important; }

.accordion-count {
  font-size: 10px;
  opacity: 0.7;
  margin-left: auto;
  margin-right: 10px;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}

.accordion-chevron {
  width: 22px; height: 22px;
  transition: transform 0.35s var(--ease-spring);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.accordion-chevron svg {
  width: 11px; height: 11px;
  stroke: var(--text-tertiary);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.accordion-item.active .accordion-chevron { transform: rotate(180deg); }
.accordion-item.active .accordion-chevron svg { stroke: var(--text-primary); }

.accordion-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.45s var(--ease-in-out),
              padding 0.45s var(--ease-in-out);
}
.accordion-item.active .accordion-content {
  max-height: 600px;
  padding: 0 22px 16px 22px;
}

.accordion-inner {
  border-left: 1px solid var(--border);
  padding-left: 0;
}

.sub-link {
  display: block;
  padding: 11px 18px;
  color: var(--text-tertiary);
  text-decoration: none;
  font-size: 13px;
  transition: all 0.2s var(--ease-spring);
  border-radius: var(--r-sm);
  margin-bottom: 2px;
  font-family: var(--font-sans);
  letter-spacing: -0.005em;
}
.sub-link:hover {
  color: var(--text-primary);
  background: rgba(255,255,255,0.04);
  padding-left: 22px;
}
.sub-link.active {
  color: var(--accent);
  background: var(--accent-subtle);
}
.sub-link small {
  font-size: 9.5px;
  color: var(--text-quaternary);
  margin-left: 10px;
  opacity: 0.85;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
}

/* ══ MENU TRIGGER ═══════════════════════════════════════════ */
.menu-trigger-btn {
  position: fixed;
  top: 24px;
  left: 24px;
  width: 46px;
  height: 46px;
  background: rgba(15,17,19,0.78);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-radius: var(--r-lg);
  border: 1px solid var(--border-mid);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 1998;
  transition: all 0.35s var(--ease-spring);
}
.menu-trigger-btn:hover {
  background: rgba(15,17,19,0.92);
  transform: scale(1.06);
  border-color: var(--border-strong);
}
.menu-trigger-btn.open { left: 366px; }

.trigger-icon {
  width: 24px;
  height: 24px;
  color: var(--text-primary);
  transition: all 0.3s var(--ease-spring);
  display: block;
}
.icon-left-panel,
.icon-right-panel {
  transition: all 0.45s var(--ease-spring);
  transform-origin: center center;
}
.menu-trigger-btn.open .icon-left-panel {
  transform: translate(5px, 8px) rotate(45deg) scaleX(2.2);
}
.menu-trigger-btn.open .icon-right-panel {
  transform: translate(-4px, -8px) rotate(-45deg) scaleX(1.5);
}

/* ══ MODAL ─ FRAUNCES + MERRIWEATHER ═══════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0);
  backdrop-filter: blur(0px);
  -webkit-backdrop-filter: blur(0px);
  z-index: 999;
  display: none;
  align-items: center;
  justify-content: center;
  transition: background 0.6s var(--ease-spring), backdrop-filter 0.6s var(--ease-spring);
}
.modal-overlay.active {
  display: flex;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
}

.modal-content {
  width: 680px;
  height: 620px;
  background: var(--modal-bg);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
  border: 1px solid var(--border-mid);
  display: flex;
  flex-direction: column;
  position: relative;
  transform: scale(0.92);
  opacity: 0;
  transition: all 0.6s var(--ease-spring);
}
.modal-overlay.active .modal-content {
  transform: scale(1);
  opacity: 1;
}
.modal-content.expanded {
  width: 880px;
  height: 92vh;
  border-radius: 28px;
}

.modal-image-container {
  height: 300px;
  width: 100%;
  position: relative;
  background: var(--surface-2);
  flex-shrink: 0;
  transition: height 0.6s var(--ease-spring);
  overflow: hidden;
}
.modal-content.expanded .modal-image-container {
  height: 440px;
  position: sticky;
  top: 0;
  z-index: 1;
}

.modal-img {
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  transition: transform 0.6s var(--ease-spring);
}
.modal-content.expanded .modal-img { transform: scale(1.04); }

.nav-chevron {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  background: rgba(7,9,11,0.55);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border-radius: 50%;
  border: 1px solid var(--border-mid);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: all 0.3s var(--ease-spring);
  opacity: 0;
  pointer-events: none;
}
.nav-chevron.visible { opacity: 1; pointer-events: all; }
.nav-chevron:hover {
  background: rgba(7,9,11,0.85);
  transform: translateY(-50%) scale(1.08);
  border-color: var(--border-strong);
}
.nav-chevron:active { transform: translateY(-50%) scale(0.94); }
.nav-chevron.prev { left: 18px; }
.nav-chevron.next { right: 18px; }
.nav-chevron::before {
  content: '';
  width: 11px;
  height: 11px;
  border-left: 2px solid var(--text-primary);
  border-bottom: 2px solid var(--text-primary);
  display: block;
}
.nav-chevron.prev::before { transform: rotate(45deg); margin-left: 3px; }
.nav-chevron.next::before { transform: rotate(-135deg); margin-right: 3px; }

.close-btn {
  position: absolute;
  top: 18px;
  right: 18px;
  z-index: 10;
  width: 34px;
  height: 34px;
  background: rgba(7,9,11,0.65);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(14px);
  border: 1px solid var(--border-mid);
  color: var(--text-primary);
  font-size: 17px;
  transition: all 0.3s var(--ease-spring);
  opacity: 0;
  pointer-events: none;
  transform: scale(0.85);
}
.modal-content.expanded .close-btn {
  opacity: 1;
  pointer-events: all;
  transform: scale(1);
}
.close-btn:hover { background: rgba(7,9,11,0.85); transform: scale(1.1); }

.expanded-close-btn {
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 10;
  width: 38px;
  height: 38px;
  background: rgba(7,9,11,0.72);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(14px);
  border: 1px solid var(--border-mid);
  color: var(--text-primary);
  font-size: 19px;
  transition: all 0.3s var(--ease-spring);
  opacity: 0;
  pointer-events: none;
  transform: scale(0.85);
}
.modal-content.expanded .expanded-close-btn {
  opacity: 1;
  pointer-events: all;
  transform: scale(1);
}

.modal-body {
  padding: 32px 40px 40px;
  overflow-y: auto;
  flex: 1;
  background: var(--modal-bg);
  position: relative;
  z-index: 2;
  transition: padding 0.6s var(--ease-spring);
  display: flex;
  flex-direction: column;
}
.modal-content.expanded .modal-body {
  padding: 48px 72px;
  overflow-y: auto;
  max-height: calc(92vh - 440px);
}

.modal-source {
  text-align: center;
  color: var(--accent-2);
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 14px;
  letter-spacing: 0.22em;
  font-family: var(--font-mono);
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.6s var(--ease-spring);
}
.modal-overlay.active .modal-source {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.1s;
}
.modal-content.expanded .modal-source {
  font-size: 12px;
  margin-bottom: 20px;
  text-align: left;
}

.modal-title {
  font-family: var(--font-display);
  font-variation-settings: "opsz" 60;
  font-size: 30px;
  font-weight: 600;
  line-height: 1.18;
  letter-spacing: -0.025em;
  margin-bottom: 16px;
  text-align: center;
  color: var(--text-primary);
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.6s var(--ease-spring);
}
.modal-overlay.active .modal-title {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.15s;
}
.modal-content.expanded .modal-title {
  font-size: 44px;
  font-variation-settings: "opsz" 144;
  margin-bottom: 28px;
  text-align: left;
  line-height: 1.08;
}

.modal-desc {
  font-family: var(--font-sans);
  font-size: 15.5px;
  line-height: 1.55;
  color: var(--text-secondary);
  margin-bottom: 24px;
  text-align: center;
  letter-spacing: -0.005em;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.6s var(--ease-spring);
}
.modal-overlay.active .modal-desc {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.2s;
}
.modal-content.expanded .modal-desc {
  font-size: 19px;
  line-height: 1.65;
  -webkit-line-clamp: unset;
  display: block;
  margin-bottom: 36px;
  text-align: left;
  font-family: var(--font-reader);
  color: var(--text-secondary);
}

.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.4s var(--ease-spring);
}
.modal-overlay.active .modal-actions {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.25s;
}
.modal-content.expanded .modal-actions {
  opacity: 0;
  transform: translateY(-10px);
  pointer-events: none;
}

.modal-btn {
  padding: 13px 26px;
  border-radius: var(--r-lg);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  font-family: var(--font-sans);
  letter-spacing: -0.005em;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-primary);
  border: 1px solid var(--border);
  transition: all 0.3s var(--ease-spring);
}
.modal-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: var(--border-mid);
  transform: translateY(-2px);
}
.modal-btn.primary {
  background: var(--accent);
  color: var(--accent-fg);
  border-color: var(--accent);
}
.modal-btn.primary:hover {
  background: var(--accent);
  filter: brightness(1.08);
}

/* ══ ARTICLE CONTENT ─ MERRIWEATHER LECTURE ════════════════ */
.article-content {
  display: none;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.65s var(--ease-spring) 0.3s;
}
.modal-content.expanded .article-content {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

.article-meta {
  display: flex;
  gap: 20px;
  margin-bottom: 36px;
  padding-bottom: 26px;
  border-bottom: 1px solid var(--border);
}
.article-meta-item {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.article-meta-item strong {
  color: var(--accent-2);
  font-weight: 600;
}

.article-text {
  font-family: var(--font-reader);
  font-size: 18px;
  line-height: 1.78;
  color: var(--text-primary);
}
.article-text p { margin-bottom: 30px; }
.article-text h2 {

      // ════════════════════════════════════════════════════════

      // ════════════════════════════════════════════════════════

      // ════════════════════════════════════════════════════════
      // SIDEBAR
      // ════════════════════════════════════════════════════════
      const menuTrigger = document.getElementById('menuTrigger');
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebarOverlay');
      const sidebarClose = document.getElementById('sidebarClose');

      function openSidebar() {
        sidebar.classList.add('open');
        sidebarOverlay.classList.add('active');
        menuTrigger.classList.add('open');
      }
      function closeSidebar() {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
        menuTrigger.classList.remove('open');
      }
      menuTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        if (sidebar.classList.contains('open')) closeSidebar();
        else openSidebar();
      });
      sidebarOverlay.addEventListener('click', closeSidebar);
      sidebarClose.addEventListener('click', closeSidebar);
      document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && !menuTrigger.contains(e.target) && sidebar.classList.contains('open')) {
          closeSidebar();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('open') && !modalOverlay.classList.contains('active')) {
          closeSidebar();
        }
      });

      // ════════════════════════════════════════════════════════
      // ACCORDÉON
      // ════════════════════════════════════════════════════════
      function handleAccordionClick(headerElement, category) {
        const item = headerElement.parentElement;
        const isActive = item.classList.contains('active');

        if (item.classList.contains('no-submenu')) {
          document.querySelectorAll('.accordion-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          showAllArticles();
          return;
        }

        document.querySelectorAll('.accordion-item:not(.no-submenu)').forEach(i => {
          if (i !== item) {
            i.classList.remove('active');
            const content = i.querySelector('.accordion-content');
            if (content) content.style.maxHeight = null;
          }
        });

        document.querySelectorAll('.accordion-item.no-submenu').forEach(i => i.classList.remove('active'));

        item.classList.toggle('active', !isActive);
        const content = item.querySelector('.accordion-content');
        if (content) {
          if (content.style.maxHeight) {
            content.style.maxHeight = null;
          } else {
            content.style.maxHeight = content.scrollHeight + 'px';
          }
        }
      }
      
      function filterByCategory(category) {
        filterToken++;
        document.querySelectorAll('.accordion-item.no-submenu').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.sub-link').forEach(l => l.classList.remove('active'));
        
        filteredArticles = allArticles.filter(a => a.cat === category);
        document.getElementById('section-title').textContent = category;
        updateFeatured();
        displayedArticles = 0;
        document.getElementById('news-grid').innerHTML = '';
        document.getElementById('news-masonry').innerHTML = '';
        document.getElementById('list-items-wrap').innerHTML = '';
        loadMoreArticles();
        buildTimeline(filteredArticles);
        closeSidebar();
        window.scrollTo({top:0, behavior:'smooth'});
      }

      function showAllArticles() {
        filterToken++;
        document.querySelectorAll('.sub-link').forEach(l => l.classList.remove('active'));
        filteredArticles = [...allArticles];
        displayedArticles = 0;
        document.getElementById('news-grid').innerHTML = '';
        document.getElementById('news-masonry').innerHTML = '';
        document.getElementById('list-items-wrap').innerHTML = '';
        document.getElementById('section-title').textContent = 'Articles récents';
        updateFeatured();
        loadMoreArticles();
        buildTimeline(filteredArticles);
        closeSidebar();
        window.scrollTo({top:0, behavior:'smooth'});
      }

      function updateFeatured() {
        if (!filteredArticles.length) return;
        const f = filteredArticles[0];
        document.getElementById('featured-card').onclick = () => openModal(f, 0);
        document.getElementById('featured-source').textContent = f.source;
        document.getElementById('featured-source').style.color = f.sourceColor;
        document.getElementById('featured-title').textContent = f.title;
        document.getElementById('featured-desc').textContent = f.description;
        document.getElementById('featured-date').textContent = getRelativeTime(f.pubDate);
        const fi = document.getElementById('featured-image');
        if (f.image) {
          fi.style.backgroundImage = "url('" + f.image + "')";
          fi.classList.remove('no-image');
        } else {
          fi.style.backgroundImage = '';
          fi.classList.add('no-image');
        }
      }

      // ════════════════════════════════════════════════════════
      // BUILD SIDEBAR
      // ════════════════════════════════════════════════════════
      function buildSidebar() {
        const cats = {};
        RSS_FEEDS.forEach(f => {
          if (!cats[f.cat]) cats[f.cat] = [];
          if (!cats[f.cat].find(x => x.slug === f.slug)) cats[f.cat].push(f);
        });

        const container = document.getElementById('sidebar-feeds');
        let html = '';
        let isFirst = true;

        for (const [catName, feeds] of Object.entries(cats)) {
          const activeClass = isFirst ? ' active' : '';
          const contentStyle = isFirst ? ' style="max-height:999px"' : '';
          const catSlug = catName.toLowerCase().replace(/\s+/g, '-');
          
          html += `
            <div class="accordion-item${activeClass}" data-category="${catSlug}">
              <div class="accordion-header">
                <span class="accordion-title" onclick="filterByCategory('${catName}'); event.stopPropagation();" style="cursor: pointer;">${catName}</span>
                <span class="accordion-count" id="cat-count-${catSlug}">0</span>
                <div class="accordion-chevron" onclick="handleAccordionClick(this.parentElement, '${catSlug}')">
                  <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
              </div>
              <div class="accordion-content"${contentStyle}>
                <div class="accordion-inner">
                  ${feeds.map(f => `
                    <a href="#" class="sub-link" onclick="filterByFeed('${f.slug}'); return false;">
                      ${f.name} <small id="cnt-${f.slug}">0</small>
                    </a>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
          isFirst = false;
        }

        container.innerHTML = html;
      }

        document.querySelectorAll('.accordion-item.no-submenu').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.sub-link').forEach(l => l.classList.remove('active'));
        document.querySelector(`.sub-link[onclick*="${slug}"]`)?.classList.add('active');

        filteredArticles = allArticles.filter(a => a.slug === slug);
        const feed = RSS_FEEDS.find(f => f.slug === slug);
        document.getElementById('section-title').textContent = feed ? feed.name : slug;
        updateFeatured();
        displayedArticles = 0;
        document.getElementById('news-grid').innerHTML = '';
        document.getElementById('news-masonry').innerHTML = '';
        document.getElementById('list-items-wrap').innerHTML = '';
        loadMoreArticles();

        window.scrollTo({top:0, behavior:'smooth'});

      // UTILITAIRES
      // ════════════════════════════════════════════════════════
      function getGreeting() {
        const h = new Date().getHours();
        return h < 12 ? 'Bonjour' : h < 18 ? 'Bon après-midi' : 'Bonsoir';
      }

      function formatDate() {
        const s = new Date().toLocaleDateString('fr-FR', {weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
        return s.toUpperCase() + ' •';
      }

      function getRelativeTime(dateString) {
        const d = new Date(dateString);
        if (isNaN(d)) return '';
        const diff = Date.now() - d;
        if (diff < 0) return 'MAINTENANT';
        const min = Math.floor(diff/60000), h = Math.floor(diff/3600000), days = Math.floor(diff/86400000);
        if (min < 1) return 'MAINTENANT';
        if (min < 60) return min + ' MIN';
        if (h < 24) return h + 'H';
        if (days === 1) return 'HIER';
        if (days < 7) return days + 'J';
        return d.toLocaleDateString('fr-FR', {day:'numeric',month:'short'}).toUpperCase();
      }

      function esc(t) { if(!t)return''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

      // ════════════════════════════════════════════════════════
      // IMAGES
      // ════════════════════════════════════════════════════════
      function extractImageFromRSS(item) {
        let img = '';
        if (item.enclosure && item.enclosure.link) img = item.enclosure.link;
        if (!img && item.thumbnail) img = item.thumbnail;
        if (!img && item['media:content']) img = item['media:content'].url;
        if (!img && item['media:thumbnail']) img = item['media:thumbnail'].url;
        if (!img && item.image) img = typeof item.image === 'string' ? item.image : item.image?.url;
        if (!img && item.imageUrl) img = item.imageUrl;
        
        if (!img && item.description) {
          const m = item.description.match(/<img[^>]+src=["']([^"']+)["']/i);
          if (m) img = m[1];
        }
        if (!img && item.content) {
          const m = item.content.match(/<img[^>]+src=["']([^"']+)["']/i);
          if (m) img = m[1];
        }
        
        if (img && (img.includes('1x1') || img.includes('tracking') || img.includes('pixel') ||
          (img.endsWith('.gif') && img.includes('track')))) {
          img = '';
        }
        return img;
      }

      async function fetchImageFromArticle(url) {
        if (imageCache.has(url)) return imageCache.get(url);
        try {
          const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
          if (!r.ok) throw 0;
          const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
          let img = null;
          const og = doc.querySelector('meta[property="og:image"]');
          if (og) img = og.getAttribute('content');
          if (!img) {
            const ogSecure = doc.querySelector('meta[property="og:image:secure_url"]');
            if (ogSecure) img = ogSecure.getAttribute('content');
          }
          if (!img) {
            const tw = doc.querySelector('meta[name="twitter:image"]');
            if (tw) img = tw.getAttribute('content');
          }
          if (!img) {
            const twLarge = doc.querySelector('meta[name="twitter:image:src"]');
            if (twLarge) img = twLarge.getAttribute('content');
          }
          if (!img) {
            const linkImg = doc.querySelector('link[rel="image_src"]');
            if (linkImg) img = linkImg.getAttribute('href');
          }
          if (!img) {
            try {
              const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
              for (const s of scripts) {
                const j = JSON.parse(s.textContent);
                if (j.image) {
                  img = typeof j.image === 'string' ? j.image : j.image.url || j.image[0]?.url || j.image[0];
                }
                if (img) break;
              }
            } catch(e) {}
          }
          if (!img) {
            const itemprop = doc.querySelector('[itemprop="image"]');
            if (itemprop) img = itemprop.getAttribute('content') || itemprop.getAttribute('src');
          }
          if (!img) {
            const selectors = ['img[class*="featured"]','img[class*="hero"]','img[class*="main"]','img[class*="article"]','figure img','.entry-content img:first-of-type','.post-content img:first-of-type','.article-image img'];
            for (const sel of selectors) {
              try {
                const el = doc.querySelector(sel);
                if (el) { img = el.getAttribute('src') || el.getAttribute('data-src'); if (img) break; }
              } catch(e) {}
            }
          }
          if (img && !img.startsWith('http')) img = new URL(img, new URL(url).origin).href;
          if (img && (img.includes('1x1') || img.includes('pixel.') || (img.endsWith('.gif') && img.includes('tracking')))) img = null;
          imageCache.set(url, img);
          return img;
        } catch(e) {
          imageCache.set(url, null);
          return null;
        }
      }

      async function enrichImages(articles) {
        const need = articles.filter(a => !a.image);
        for (let i = 0; i < need.length; i += 5) {
          await Promise.all(need.slice(i, i+5).map(async a => {
            const img = await fetchImageFromArticle(a.link);
            if (img) { a.image = img; updateImageInDOM(a); }
          }));
          if (i+5 < need.length) await new Promise(r => setTimeout(r, 1000));
        }
      }

      function updateImageInDOM(article) {
        document.querySelectorAll('.news-card').forEach(card => {
          if (card.querySelector('.card-body-title')?.textContent === article.title) {
            const el = card.querySelector('.card-img');
            const wrap = card.querySelector('.card-img-wrap');
            if (el && article.image) {
              el.style.backgroundImage = "url('" + article.image + "')";
              wrap.classList.remove('no-image');
            }
          }
        });
        document.querySelectorAll('.masonry-card').forEach(card => {
          if (card.querySelector('.masonry-body-title')?.textContent === article.title) {
            const wrap = card.querySelector('.masonry-img-wrap');
            if (wrap && article.image) {
              wrap.classList.remove('no-image');
              let img = wrap.querySelector('img');
              if (!img) {
                img = document.createElement('img');
                img.className = 'masonry-img';
                img.src = article.image;
                img.onerror = function() { this.style.display = 'none'; };
                wrap.appendChild(img);
              }
            }
          }
        });
        document.querySelectorAll('.list-item').forEach(item => {
          if (item.querySelector('.list-item-title')?.textContent === article.title && article.image) {
            const wrap = item.querySelector('.list-item-img');
            if (wrap) {
              wrap.classList.remove('no-image');
              let img = wrap.querySelector('img');
              if (img) img.src = article.image;
              else {
                img = document.createElement('img');
                img.src = article.image;
                img.onerror = function(){this.classList.add('failed')};
                wrap.appendChild(img);
              }
            }
          }
        });
        if (document.getElementById('featured-title')?.textContent === article.title && article.image) {
          const fi = document.getElementById('featured-image');
          fi.style.backgroundImage = "url('" + article.image + "')";
          fi.classList.remove('no-image');
        }
      }

      // ════════════════════════════════════════════════════════
      // RSS LOADING
      // ════════════════════════════════════════════════════════
      function parseRSS(data, feed) {
        if (data.items) {
          return data.items.map(item => ({
            title: item.title || '',
            link: item.link || '#',
            description: (item.description || item.content || '').replace(/<[^>]*>/g, '').substring(0, 200),
            pubDate: item.pubDate || new Date().toISOString(),
            image: extractImageFromRSS(item),
            source: feed.name,
            sourceColor: feed.color,
            slug: feed.slug,
            cat: feed.cat
          }));
        }
        return [];
      }

      async function loadFeed(feed) {
        try {
          const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url));
          const d = await r.json();
          if (d.status === 'ok' && d.items && d.items.length) return parseRSS(d, feed);
        } catch(e) {}
        try {
          const r = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(feed.url));
          const d = await r.json();
          if (d.contents) {
            const xml = new DOMParser().parseFromString(d.contents, 'text/xml');
            const items = Array.from(xml.querySelectorAll('item, entry')).map(el => {
              const get = n => { const e = el.querySelector(n); return e ? e.textContent.trim() : ''; };
              return {
                title: get('title'),
                link: get('link') || (el.querySelector('link')?.getAttribute('href')||''),
                description: get('description')||get('summary'),
                pubDate: get('pubDate')||get('published')||get('updated')
              };
            });
            if (items.length) return items.map(item => ({
              title: item.title,
              link: item.link,
              description: (item.description||'').replace(/<[^>]*>/g,'').substring(0,200),
              pubDate: item.pubDate || new Date().toISOString(),
              image: '',
              source: feed.name,
              sourceColor: feed.color,
              slug: feed.slug,
              cat: feed.cat
            }));
          }
        } catch(e) {}
        try {
          const r = await fetch('https://corsproxy.io/?' + encodeURIComponent(feed.url));
          const xml = new DOMParser().parseFromString(await r.text(), 'text/xml');
          const items = Array.from(xml.querySelectorAll('item, entry')).map(el => {
            const get = n => { const e = el.querySelector(n); return e ? e.textContent.trim() : ''; };
            return {
              title: get('title'),
              link: get('link') || (el.querySelector('link')?.getAttribute('href')||''),
              description: get('description')||get('summary'),
              pubDate: get('pubDate')||get('published')||get('updated')
            };
          });
          if (items.length) return items.map(item => ({
            title: item.title,
            link: item.link,
            description: (item.description||'').replace(/<[^>]*>/g,'').substring(0,200),
            pubDate: item.pubDate || new Date().toISOString(),
            image: '',
            source: feed.name,
            sourceColor: feed.color,
            slug: feed.slug,
            cat: feed.cat
          }));
        } catch(e) {}
        return [];
      }

      // ════════════════════════════════════════════════════════
      // LOAD ALL
      // ════════════════════════════════════════════════════════
      async function loadAllNews() {
        try {
          const results = await Promise.allSettled(RSS_FEEDS.map(f => loadFeed(f)));
          allArticles = [];
          results.forEach(r => {
            if (r.status === 'fulfilled' && r.value && r.value.length) {
              allArticles.push(...r.value);
            }
          });
          allArticles.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
          filteredArticles = [...allArticles];

          document.getElementById('badge-all').textContent = allArticles.length;
          const seen = new Set();
          RSS_FEEDS.forEach(f => {
            if (seen.has(f.slug)) return;
            seen.add(f.slug);
            const el = document.getElementById('cnt-' + f.slug);
            if (el) el.textContent = allArticles.filter(a => a.slug === f.slug).length;
          });
          const catCounts = {};
          allArticles.forEach(a => { if (!catCounts[a.cat]) catCounts[a.cat] = 0; catCounts[a.cat]++; });
          Object.entries(catCounts).forEach(([cat, count]) => {
            const catSlug = cat.toLowerCase().replace(/\s+/g, '-');
            const el = document.getElementById('cat-count-' + catSlug);
            if (el) el.textContent = count;
          });

          // ── BRIEFING MARQUEE
          const briefingContainer = document.getElementById('briefing-container');
          if (allArticles.length) {
            const marqueeArticles = allArticles.slice(0, 20);
            const row1Articles = marqueeArticles.filter((_, i) => i % 2 === 0);
            const row2Articles = marqueeArticles.filter((_, i) => i % 2 === 1);
            const createCard = (a) => {
              const realIdx = allArticles.indexOf(a);
              return '<div class="marquee-card" onclick="openModalIdx(' + realIdx + ')">' +
                '<div class="marquee-card-img" style="background-image: url(\'' + (a.image || '') + '\')"></div>' +
                '<div class="marquee-card-source" style="color:' + a.sourceColor + '">' + esc(a.source) + '</div>' +
                '<div class="marquee-hover-overlay">' +
                  '<div class="marquee-cta"><span>Lire</span><span class="marquee-cta-arrow"></span></div>' +
                '</div>' +
              '</div>';
            };
            const row1HTML = row1Articles.map(createCard).join('');
            const row2HTML = row2Articles.map(createCard).join('');
            briefingContainer.innerHTML =
              '<div class="apple-marquee-container">' +
                '<div class="marquee-controls">' +
                  '<button class="pause-btn" id="marquee-pause" aria-label="Pause">' +
                    '<span class="pause-bar"></span><span class="pause-bar"></span>' +
                  '</button>' +
                '</div>' +
                '<div class="marquee-row row-1" id="marquee-row-1">' +
                  '<div class="marquee-track">' + row1HTML + '</div>' +
                  '<div class="marquee-track">' + row1HTML + '</div>' +
                '</div>' +
                '<div class="marquee-row row-2" id="marquee-row-2">' +
                  '<div class="marquee-track">' + row2HTML + '</div>' +
                  '<div class="marquee-track">' + row2HTML + '</div>' +
                '</div>' +
              '</div>';
            setTimeout(() => {
              const pauseBtn = document.getElementById('marquee-pause');
              const row1 = document.getElementById('marquee-row-1');
              const row2 = document.getElementById('marquee-row-2');
              if (pauseBtn && row1 && row2) {
                pauseBtn.addEventListener('click', () => {
                  row1.classList.toggle('paused');
                  row2.classList.toggle('paused');
                  pauseBtn.classList.toggle('playing');
                });
              }
            }, 100);
          }

          updateFeatured();

          filterToken++;
          displayedArticles = 0;
          document.getElementById('news-grid').innerHTML = '';
          document.getElementById('news-masonry').innerHTML = '';
          document.getElementById('list-items-wrap').innerHTML = '';
          loadMoreArticles();
          buildTimeline(filteredArticles);
          setTimeout(() => enrichImages(allArticles), 1000);
        } catch(e) {
          console.error('[Briefeed]', e);
        }
      }

      // ════════════════════════════════════════════════════════
      // DISPLAY ARTICLES
      // ════════════════════════════════════════════════════════
      function loadMoreArticles() {
        if (isLoading) return;
        isLoading = true;
        const myToken = filterToken;

        const grid = document.getElementById('news-grid');
        const masonry = document.getElementById('news-masonry');
        const list = document.getElementById('list-items-wrap');
        grid.querySelector('.loading-indicator')?.remove();

        const realStart = displayedArticles + 1;
        const realEnd = Math.min(realStart + ARTICLES_PER_LOAD, filteredArticles.length);
        const batch = filteredArticles.slice(realStart, realEnd);

        const gridHTML = batch.map((a, idx) => {
          const gi = realStart + idx;
          return '<div class="news-card" onclick="openModalIdx(' + gi + ')">' +
            '<div class="card-img-wrap ' + (a.image ? '' : 'no-image') + '">' +
              '<div class="card-img" style="' + (a.image ? "background-image:url('" + esc(a.image) + "')" : '') + '"></div>' +
            '</div>' +
            '<div class="card-body">' +
              '<p class="card-body-title">' + esc(a.title) + '</p>' +
              '<div class="card-body-meta">' +
                '<span class="card-source" style="color:' + a.sourceColor + '">' + esc(a.source) + '</span>' +
                '<span class="card-sep">·</span>' +
                '<span class="card-date">' + getRelativeTime(a.pubDate) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        const masonryHTML = batch.map((a, idx) => {
          const gi = realStart + idx;
          return '<div class="masonry-card" onclick="openModalIdx(' + gi + ')">' +
            '<div class="masonry-img-wrap ' + (a.image ? '' : 'no-image') + '">' +
              (a.image ? '<img class="masonry-img" src="' + esc(a.image) + '" onerror="this.style.display=\'none\'">' : '') +
            '</div>' +
            '<div class="masonry-body">' +
              '<p class="masonry-body-title">' + esc(a.title) + '</p>' +
              '<p class="masonry-body-desc">' + esc(a.description) + '</p>' +
              '<div class="masonry-body-meta">' +
                '<span class="masonry-source" style="color:' + a.sourceColor + '">' + esc(a.source) + '</span>' +
                '<span class="card-sep">·</span>' +
                '<span class="card-date">' + getRelativeTime(a.pubDate) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        const listHTML = batch.map((a, idx) => {
          const gi = realStart + idx;
          return '<div class="list-item" onclick="openModalIdx(' + gi + ')">' +
            '<div class="list-item-body">' +
              '<p class="list-item-title">' + esc(a.title) + '</p>' +
              '<p class="list-item-desc">' + esc(a.description) + '</p>' +
              '<div class="list-item-meta">' +
                '<span class="list-item-source" style="color:' + a.sourceColor + '">' + esc(a.source) + '</span>' +
                '<span class="card-sep">·</span>' +
                '<span class="list-item-time">' + getRelativeTime(a.pubDate) + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="list-item-img ' + (a.image ? '' : 'no-image') + '">' +
              (a.image ? '<img src="' + esc(a.image) + '" onerror="this.classList.add(\'failed\')">' : '') +
            '</div>' +
          '</div>';
        }).join('');

        if (myToken === filterToken) {
          grid.insertAdjacentHTML('beforeend', gridHTML);
          masonry.insertAdjacentHTML('beforeend', masonryHTML);
          list.insertAdjacentHTML('beforeend', listHTML);
          displayedArticles += batch.length;
          if (displayedArticles + 1 < filteredArticles.length) {
            grid.insertAdjacentHTML('beforeend', '<div class="loading-indicator">Chargement…</div>');
          }
        }
        isLoading = false;
      }

      // ════════════════════════════════════════════════════════
      // MODAL
      // ════════════════════════════════════════════════════════
      function openModal(article, index) {
        currentArticle = article;
        currentArticleIndex = index;
        isExpanded = false;
        modalContent.classList.remove('expanded');

        document.getElementById('modal-source').textContent = article.source;
        document.getElementById('modal-title').textContent = article.title;
        document.getElementById('modal-desc').textContent = article.description;
        document.getElementById('modal-img').style.backgroundImage = article.image ?
          "url('" + article.image + "')" : 'linear-gradient(135deg,#1a1a1a,#2a2a2a)';
        articleContent.style.display = 'none';
        articleContent.innerHTML = '';

        modalOverlay.classList.add('active');
        app.classList.add('blurred');
        document.body.style.overflow = 'hidden';
        updateChevrons();
      }

      window.openModalIdx = function(idx) { openModal(filteredArticles[idx], idx); };

      function updateChevrons() {
        navPrev.classList.toggle('visible', currentArticleIndex > 0);
        navNext.classList.toggle('visible', currentArticleIndex < filteredArticles.length - 1 && currentArticleIndex !== -1);
      }

      function navigateModal(delta) {
        const ni = currentArticleIndex + delta;
        if (ni < 0 || ni >= filteredArticles.length) return;
        currentArticleIndex = ni;
        const a = filteredArticles[ni];
        currentArticle = a;
        modalContent.style.opacity = '0';
        modalContent.style.transform = 'scale(0.96)';
        setTimeout(() => {
          document.getElementById('modal-source').textContent = a.source;
          document.getElementById('modal-title').textContent = a.title;
          document.getElementById('modal-desc').textContent = a.description;
          document.getElementById('modal-img').style.backgroundImage = a.image ?
            "url('" + a.image + "')" : 'linear-gradient(135deg,#1a1a1a,#2a2a2a)';
          updateChevrons();
          modalContent.style.opacity = '1';
          modalContent.style.transform = 'scale(1)';
        }, 200);
      }

      function closeModal() {
        if (isExpanded) {
          isExpanded = false;
          modalContent.classList.remove('expanded');
          setTimeout(() => {
            articleContent.style.display = 'none';
            modalOverlay.classList.remove('active');
            app.classList.remove('blurred');
            document.body.style.overflow = '';
          }, 600);
        } else {
          modalOverlay.classList.remove('active');
          app.classList.remove('blurred');
          document.body.style.overflow = '';
        }
      }

      function expandModal() {
        if (isExpanded) return;
        isExpanded = true;
        modalContent.classList.add('expanded');
        articleContent.style.display = 'block';
        loadArticleContent(currentArticle);
      }

      async function loadArticleContent(article) {
        articleContent.innerHTML = '<div class="article-loading"><div class="article-spinner"></div><div>Chargement…</div></div>';
        try {
          const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(article.link));
          const html = await r.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          ['nav','footer','[id*="cookie"]','[class*="cookie"]','[class*="consent"]','[class*="share"]','[class*="social"]','[class*="newsletter"]','[class*="ad-"]','script','style','noscript'].forEach(s => {
            try{doc.querySelectorAll(s).forEach(el=>el.remove())}catch(e){}
          });
          if (typeof Readability !== 'undefined') {
            const reader = new Readability(doc);
            const parsed = reader.parse();
            if (parsed && parsed.content) {
              articleContent.innerHTML =
                '<div class="article-meta">' +
                  '<div class="article-meta-item"><strong>' + article.source + '</strong></div>' +
                  '<div class="article-meta-item">' + getRelativeTime(article.pubDate) + '</div>' +
                '</div>' +
                '<div class="article-text">' + parsed.content + '</div>';
              return;
            }
          }
          throw 0;
        } catch(e) {
          articleContent.innerHTML =
            '<div class="article-loading">' +
              '<div style="color:var(--danger);margin-bottom:18px;">IMPOSSIBLE DE CHARGER</div>' +
              '<a href="' + esc(article.link) + '" target="_blank" style="color:var(--accent-2);text-decoration:underline;">Lire sur le site source →</a>' +
            '</div>';
        }
      }

      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('expanded-close').addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
      document.getElementById('btn-read').addEventListener('click', expandModal);
      document.getElementById('btn-external').addEventListener('click', expandModal);
      navPrev.addEventListener('click', () => navigateModal(-1));
      navNext.addEventListener('click', () => navigateModal(1));
      document.addEventListener('keydown', (e) => {
        if (!modalOverlay.classList.contains('active')) return;
        if (e.key === 'Escape') closeModal();
        else if (e.key === 'ArrowLeft') navigateModal(-1);
        else if (e.key === 'ArrowRight') navigateModal(1);
      });

      // ════════════════════════════════════════════════════════
      // TIMELINE
      // ════════════════════════════════════════════════════════
      function dayKey(d) {
        const dt = new Date(d);
        return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      }
      function dayLabel(key) {
        const [y,m,d] = key.split('-').map(Number);
        const date = new Date(y,m-1,d);
        const today = new Date(); today.setHours(0,0,0,0);
        const yest = new Date(today); yest.setDate(today.getDate()-1);
        if (date.getTime() === today.getTime()) return "AUJOURD'HUI";
        if (date.getTime() === yest.getTime()) return "HIER";
        return date.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long'}).toUpperCase();
      }
      function buildTimeline(articles) {
        const seen = new Set();
        tlDates = [];
        articles.forEach(a => {
          const k = dayKey(a.pubDate);
          if (!seen.has(k)) { seen.add(k); tlDates.push(k); }
        });
        tlDates.sort((a,b) => b.localeCompare(a));
        tlIdx = 0;
        const nav = document.getElementById('timelineNav');
        if (tlDates.length > 1) { nav.classList.add('visible'); updateTimeline(); }
        else { nav.classList.remove('visible'); }
      }
      function updateTimeline() {
        const key = tlDates[tlIdx];
        document.getElementById('tlDate').textContent = dayLabel(key);
        document.getElementById('tlCount').textContent = filteredArticles.filter(a => dayKey(a.pubDate) === key).length;
        document.getElementById('tlPrev').disabled = tlIdx >= tlDates.length - 1;
        document.getElementById('tlNext').disabled = tlIdx <= 0;
      }
      document.getElementById('tlPrev').addEventListener('click', () => {
        if (tlIdx >= tlDates.length - 1) return;
        tlIdx++; updateTimeline(); filterByDate(tlDates[tlIdx]);
      });
      document.getElementById('tlNext').addEventListener('click', () => {
        if (tlIdx <= 0) return;
        tlIdx--; updateTimeline(); filterByDate(tlDates[tlIdx]);
      });
      function filterByDate(dateKey) {
        const temp = filteredArticles;
        const byDate = temp.filter(a => dayKey(a.pubDate) === dateKey);
        if (!byDate.length) return;
        filterToken++;
        displayedArticles = 0;
        document.getElementById('news-grid').innerHTML = '';
        document.getElementById('news-masonry').innerHTML = '';
        document.getElementById('list-items-wrap').innerHTML = '';
        const saved = filteredArticles;
        filteredArticles = byDate;
        loadMoreArticles();
        filteredArticles = saved;
        window.scrollTo({top:0, behavior:'smooth'});
      }

      // ════════════════════════════════════════════════════════
      // INFINITE SCROLL
      // ════════════════════════════════════════════════════════
      function handleScroll() {
        const grid = document.getElementById('news-grid');
        const rect = grid.getBoundingClientRect();
        if (rect.bottom <= window.innerHeight + 500 && displayedArticles < filteredArticles.length) {
          loadMoreArticles();
        }
      }

      // ════════════════════════════════════════════════════════
      // INIT
      // ════════════════════════════════════════════════════════
      document.getElementById('greeting').textContent = getGreeting();
      document.getElementById('datetime').textContent = formatDate();
      buildSidebar();
      loadAllNews();
      setInterval(loadAllNews, 300000);
      window.addEventListener('scroll', handleScroll);
      window.addEventListener('resize', handleScroll);
    </script>
